[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mirrorguard"
version = "0.1.0"
description = "Measures and reduces AI sycophancy towards psychologically vulnerable users"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
mirrorguard = "mirrorguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mirrorguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
